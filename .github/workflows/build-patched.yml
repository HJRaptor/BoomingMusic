name: Build patched BoomingMusic
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Apply lyricInfo patch
        run: |
          git apply --check boomingmusic-lyricinfo.patch
          git apply boomingmusic-lyricinfo.patch

      - name: Change application ID
        run: |
          sed -i 's/applicationId = namespace/applicationId = "com.heytap.music"/' app/build.gradle.kts
          grep -n 'applicationId' app/build.gradle.kts

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: BoomingMusic-patched
          path: app/build/outputs/apk/github/release/*.apk
